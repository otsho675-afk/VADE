name: vadesi
description: "Taksit, fatura ve alacaklar icin kisisel odeme takip uygulamasi."
publish_to: none
version: 1.3.0+13

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  sqflite_common: ^2.5.4
  sqflite_common_ffi: 2.3.6
  sqflite_common_ffi_web: ^0.4.5
  sqlite3: '>=2.7.6 <3.0.0'
  sqlite3_flutter_libs: ^0.5.28
  file_picker: 10.3.10
  path: ^1.9.0
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  intl: ^0.20.3
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_database: ^12.0.0
  cloud_functions: ^6.0.0
  onesignal_flutter: ^5.7.0
  in_app_purchase: ^3.2.3
  url_launcher: ^6.3.2
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/vadesi_mark.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/vadesi_mark.png
  min_sdk_android: 23
  adaptive_icon_background: '#243F56'
  adaptive_icon_foreground: assets/images/vadesi_mark.png
  web:
    generate: true
    image_path: assets/images/vadesi_mark.png
    background_color: '#243F56'
    theme_color: '#243F56'

