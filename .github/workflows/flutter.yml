name: Flutter verification and downloads
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.sha }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: backend/functions
      - run: npm run check && npm test
        working-directory: backend/functions
      - run: node --check backend/admin/app.js && node --check backend/admin/delete.js
      - run: python3 -m py_compile scripts/*.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
        working-directory: backend/rules-test
      - run: npx firebase emulators:exec --config ../firebase.test.json --project demo-vadesi --only firestore,database 'npm test'
        working-directory: backend/rules-test
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Resolved dependency lock
        run: cat pubspec.lock
      - run: dart run sqflite_common_ffi_web:setup
      - run: dart run flutter_launcher_icons -f web_icons.yaml
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-Web
          path: build/web
          if-no-files-found: error
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VADESI-Web
          path: build/web
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Verify web startup and persistent payments
        run: |
          python3 -m http.server 8080 --directory build/web > /tmp/vadesi-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/web_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VADESI-Interface-Previews
          path: web-*.png
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: bash scripts/kur.sh
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-Android-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Package complete source with native hosts
        run: |
          mkdir -p dist
          python3 scripts/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-Complete-Source
          path: dist/VADESI.zip
          if-no-files-found: error
  ios:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: bash scripts/kur.sh
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-iOS-Unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error

  android_bundle:
    # One-time release on a '[aab]' commit or an explicit manual workflow run.
    # Never replace the established Play upload key automatically.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[aab]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: bash scripts/kur.sh
      - name: Restore existing Google Play upload signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VADE_ANDROID_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.VADE_ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VADE_ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.VADE_ANDROID_STORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$STORE_PASSWORD" ]]; then
            echo "::error::Play upload key missing. Configure VADE_ANDROID_KEYSTORE_BASE64, VADE_ANDROID_KEY_ALIAS, VADE_ANDROID_KEY_PASSWORD, VADE_ANDROID_STORE_PASSWORD as GitHub Actions repository secrets. Do not create a new signing identity for an existing Play app."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          if [[ ! -s android/upload-keystore.jks ]]; then
            echo "::error::Android keystore could not be decoded."
            exit 1
          fi
          {
            printf 'storeFile=upload-keystore.jks\n'
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties android/upload-keystore.jks
      - name: Build signed release Android App Bundle
        run: flutter build appbundle --release
      - name: Verify release App Bundle signature
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          jarsigner -verify "$AAB" | grep -F 'jar verified.'
          cp "$AAB" build/app/outputs/bundle/release/VADESI-1.3.1-build16-play.aab
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-Android-Play-AAB-Build16
          path: build/app/outputs/bundle/release/VADESI-1.3.1-build16-play.aab
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks
