name: Flutter verification and downloads
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart run sqflite_common_ffi_web:setup
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-Web
          path: build/web
          if-no-files-found: error
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash scripts/kur.sh
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-Android-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Package complete source with native hosts
        run: |
          mkdir -p dist
          python3 scripts/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-Complete-Source
          path: dist/VADESI.zip
          if-no-files-found: error
  ios:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: bash scripts/kur.sh
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-iOS-Unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
