name: Flutter verification and downloads
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: backend/functions
      - run: npm run check && npm test
        working-directory: backend/functions
      - run: node --check backend/admin/app.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
        working-directory: backend/rules-test
      - run: npx firebase emulators:exec --config ../firebase.test.json --project demo-vadesi --only firestore,database 'npm test'
        working-directory: backend/rules-test
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Resolved dependency lock
        run: cat pubspec.lock
      - run: dart run sqflite_common_ffi_web:setup
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-Web
          path: build/web
          if-no-files-found: error
  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VADESI-Web
          path: build/web
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Verify web startup and persistent payments
        run: |
          python3 -m http.server 8080 --directory build/web > /tmp/vadesi-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/web_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Web-test-diagnostics
          path: web-smoke-failure.png
  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: bash scripts/kur.sh
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-Android-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Package complete source with native hosts
        run: |
          mkdir -p dist
          python3 scripts/package_source.py
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-Complete-Source
          path: dist/VADESI.zip
          if-no-files-found: error
  ios:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: bash scripts/kur.sh
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: VADESI-iOS-Unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
