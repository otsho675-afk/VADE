name: VADE - Free iOS App Store IPA

# Upload signed releases to TestFlight automatically whenever main is updated.
# Manual runs remain supported for retries, using the current main branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vadesi-app-store-ipa
  cancel-in-progress: false

jobs:
  signed-ipa:
    name: Build signed App Store IPA
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Verify Apple signing secrets
        env:
          CERT_B64: ${{ secrets.VADE_IOS_P12_BASE64 }}
          CERT_PASS: ${{ secrets.VADE_IOS_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.VADE_IOS_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          for secret in CERT_B64 CERT_PASS PROFILE_B64; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing signing secret: ${secret}. See the VADE setup instructions."
              exit 1
            fi
          done

      - name: Checkout VADE main release code
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Show source revision
        run: git log -1 --oneline

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Prepare Flutter and native assets
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/kur.sh

      - name: Install signing certificate and provisioning profile
        env:
          CERT_B64: ${{ secrets.VADE_IOS_P12_BASE64 }}
          CERT_PASS: ${{ secrets.VADE_IOS_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.VADE_IOS_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          sign_dir="$RUNNER_TEMP/vadesi-signing"
          mkdir -p "$sign_dir"
          chmod 700 "$sign_dir"
          cert_path="$sign_dir/distribution.p12"
          profile_path="$sign_dir/app-store.mobileprovision"
          keychain_path="$RUNNER_TEMP/vadesi-signing.keychain-db"
          keychain_password="$(uuidgen)-$(uuidgen)"
          # Decode inside Python, ignoring harmless newlines. Diagnose
          # which secret is invalid without writing private keys to logs.
          CERT_FILE="$cert_path" PROFILE_FILE="$profile_path" python3 - <<'PY'
          import base64
          import binascii
          import os
          from pathlib import Path

          for env_name, secret_name, path_name in (
              ("CERT_B64", "VADE_IOS_P12_BASE64", "CERT_FILE"),
              ("PROFILE_B64", "VADE_IOS_PROFILE_BASE64", "PROFILE_FILE"),
          ):
              raw = "".join(os.environ[env_name].split())
              try:
                  binary = base64.b64decode(raw, validate=True)
              except (binascii.Error, ValueError):
                  print(f"::error::Invalid Base64 in {secret_name}. Generate it again from the original file.", flush=True)
                  raise SystemExit(1)
              if len(binary) < 100 or binary[0] != 0x30:
                  print(f"::error::{secret_name} does not contain a valid DER-encoded Apple signing file.", flush=True)
                  raise SystemExit(1)
              dest = Path(os.environ[path_name])
              dest.write_bytes(binary)
              dest.chmod(0o600)
              print(f"Decoded {secret_name} successfully.", flush=True)
          PY

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$CERT_PASS" -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          openssl cms -verify -inform DER -in "$profile_path" -noverify -out "$sign_dir/profile.plist" >/dev/null 2>&1
          profile_uuid="$(python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1], "rb"))["UUID"])' "$sign_dir/profile.plist")"
          profile_dest="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dest"
          cp "$profile_path" "$profile_dest/$profile_uuid.mobileprovision"
          python3 scripts/ci_ios_signing.py "$sign_dir/profile.plist" "$sign_dir/ExportOptions.plist"

      - name: Build signed iOS IPA
        shell: bash
        run: |
          set -euo pipefail
          # App Store Connect rejects an already-uploaded CFBundleVersion.
          # This workflow's run number increases for both push and manual runs.
          build_number=$((10000 + GITHUB_RUN_NUMBER))
          echo "Building VADE iOS with unique build number: $build_number"
          flutter build ipa --release --build-number="$build_number" --export-options-plist="$RUNNER_TEMP/vadesi-signing/ExportOptions.plist"
          ls -lh build/ios/ipa/*.ipa

      - name: Downloadable App Store IPA
        uses: actions/upload-artifact@v6
        with:
          name: VADE-App-Store-Signed-IPA
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload IPA to App Store Connect for TestFlight
        env:
          ASC_ISSUER_ID: ${{ secrets.VADE_ASC_API_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.VADE_ASC_API_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.VADE_ASC_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ASC_ISSUER_ID" || -z "$ASC_KEY_ID" || -z "$ASC_PRIVATE_KEY" ]]; then
            echo "::error::Incomplete App Store Connect API configuration. All three VADE_ASC_API_* Secrets are required."
            exit 1
          fi
          if [[ ! "$ASC_KEY_ID" =~ ^[A-Za-z0-9]{10}$ ]]; then
            echo "::error::VADE_ASC_API_KEY_ID must be the 10-character App Store Connect API Key ID."
            exit 1
          fi
          if [[ ! "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::VADE_ASC_API_ISSUER_ID must be an App Store Connect Issuer ID (UUID)."
            exit 1
          fi
          if [[ "$ASC_PRIVATE_KEY" != *"BEGIN PRIVATE KEY"* || "$ASC_PRIVATE_KEY" != *"END PRIVATE KEY"* ]]; then
            echo "::error::VADE_ASC_API_PRIVATE_KEY must contain the full unmodified AuthKey_*.p8 file contents."
            exit 1
          fi
          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if (( ${#ipa_files[@]} != 1 )); then
            echo "::error::Expected exactly one signed IPA artifact to upload."
            exit 1
          fi
          private_dir="$RUNNER_TEMP/vadesi-asc-private-keys"
          mkdir -p "$private_dir"
          chmod 700 "$private_dir"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$private_dir/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$private_dir/AuthKey_${ASC_KEY_ID}.p8"
          echo "Uploading signed VADE IPA to App Store Connect..."
          API_PRIVATE_KEYS_DIR="$private_dir" xcrun altool --upload-app --type ios --file "${ipa_files[0]}" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Apple upload accepted. The build may take additional time to appear in TestFlight after processing."

      - name: Remove temporary signing assets
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/vadesi-signing.keychain-db" >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/vadesi-signing" "$RUNNER_TEMP/vadesi-asc-private-keys"
